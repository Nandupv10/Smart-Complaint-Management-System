# ==============================================================================
# Smart Complaint Management System (SCMS) - Production Nginx Configuration
# Fulfills NFR05 (Privacy & HTTPS) and SR6 (TLS Termination & HTTPS Redirection)
# Architecture: Browser -> Nginx (TLS 1.2+) -> Node.js/Express API -> MySQL
# ==============================================================================

# HTTP Server: Redirect all plain HTTP traffic to HTTPS via 301
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge for Let's Encrypt automated certificate issuance / renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS (SR6, TC12)
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server: TLS Termination and Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # TLS Protocol Version Configuration (NFR05: TLS 1.2 or higher only)
    # SSLv2, SSLv3, TLS 1.0, and TLS 1.1 are explicitly disabled
    ssl_protocols TLSv1.2 TLSv1.3;

    # Secure Ciphers (prefer ECDHE with forward secrecy)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    # TLS Session Parameters
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Production Certificate and Private Key Paths
    # IMPORTANT: Certificates and keys must remain outside version control
    ssl_certificate /etc/ssl/certs/scms.crt;
    ssl_certificate_key /etc/ssl/private/scms.key;

    # Security Headers for Privacy and Data Protection (NFR05)
    # HTTP Strict Transport Security (HSTS) enforces HTTPS for 2 years
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse Proxy to Express.js Backend API
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Forward connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward client identity and protocol information to backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable cache bypass
        proxy_cache_bypass $http_upgrade;

        # Timeouts for stability
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
